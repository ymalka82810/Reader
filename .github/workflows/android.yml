name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      # Capacitor is installed only here, so package.json and the lockfile stay untouched.
      # @capacitor/app makes the back gesture go back in the WebView's history (the reader uses it) instead of closing the app.
      - run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - run: npx cap init "קורא ספרים" com.yanivm.reader --web-dir dist
      - run: npx cap add android
      # Launcher icons: Capacitor generates android/ fresh each run, so copy ours in.
      - run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          cp -r resources/android/. android/app/src/main/res/
      # Self-update: native plugin + permission + FileProvider path + versionCode = run number (tag v1.0.<n> ends with it).
      - run: |
          pkg=android/app/src/main/java/com/yanivm/reader
          cp resources/android-updater/AppUpdaterPlugin.java $pkg/
          sed -i 's/^public class MainActivity extends BridgeActivity {}$/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(AppUpdaterPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}/' $pkg/MainActivity.java
          grep -q registerPlugin $pkg/MainActivity.java
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</paths>#    <external-files-path name="app_update" path="app-update/" />\n</paths>#' android/app/src/main/res/xml/file_paths.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
      # Release build (smaller, faster, WebView not debuggable), signed with the same fixed key (secrets)
      # so every build, including the earlier debug ones, can update the previous one.
      - run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
          cat >> android/app/build.gradle <<'EOF'
          android.signingConfigs {
            release {
              storeFile file('release.p12')
              storeType 'pkcs12'
              storePassword System.getenv('KEYSTORE_PASSWORD')
              keyAlias 'reader'
              keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
          }
          android.buildTypes.release.signingConfig android.signingConfigs.release
          // lint on the generated Capacitor project only slows the build down
          android.lint.checkReleaseBuilds false
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: npx cap sync android
      # Cache Gradle downloads (Gradle itself, Android libraries) between builds. Key follows the lockfile because the
      # Capacitor version decides the Gradle and library versions; restore-keys reuse the latest cache when it changes.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'resources/**', '.github/workflows/android.yml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: printf '\norg.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n' >> android/gradle.properties
      - run: ./gradlew assembleRelease --build-cache
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: reader-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish release (used by the in-app updater)
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          gh release create "v1.0.${{ github.run_number }}" "$apk" --title "v1.0.${{ github.run_number }}" \
            --notes "$(printf 'versionCode: %s\nsha256: %s' '${{ github.run_number }}' "$sha")"
        env:
          GH_TOKEN: ${{ github.token }}
