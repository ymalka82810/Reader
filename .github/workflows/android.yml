name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      # Capacitor is installed only here, so package.json and the lockfile stay untouched.
      # The back gesture is handled by AppUpdaterPlugin (a "back" event to the web side), not by @capacitor/app (not installed):
      # it would add its own back handler next to ours.
      - run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - run: npx cap init "קורא ספרים" com.yanivm.reader --web-dir dist
      - run: npx cap add android
      # Launcher icons: Capacitor generates android/ fresh each run, so copy ours in.
      - run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          cp -r resources/android/. android/app/src/main/res/
      # No black screen while the app starts: the system splash, the window and the WebView all take the color of
      # the web splash (#splash in index.html), and the system splash shows the app's icon, so the native launch
      # flows straight into the page-flipping splash.
      - run: |
          sed -i "s#webDir: 'dist'#webDir: 'dist',\n  backgroundColor: '\#15294d'#" capacitor.config.ts
          grep -q "backgroundColor: '#15294d'" capacitor.config.ts
          cat > android/app/src/main/res/values/splash_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splash_background">#15294D</color>
          </resources>
          EOF
          python3 - <<'PY'
          p = 'android/app/src/main/res/values/styles.xml'
          m = open(p, encoding='utf-8').read()
          launch = '<item name="android:background">@drawable/splash</item>'
          assert launch in m
          m = m.replace(launch,
              '<item name="android:background">@color/splash_background</item>\n'
              '        <item name="windowSplashScreenBackground">@color/splash_background</item>\n'
              '        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>\n'
              '        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>', 1)
          bar = '<item name="android:background">@null</item>'
          assert bar in m
          m = m.replace(bar, bar + '\n        <item name="android:windowBackground">@color/splash_background</item>', 1)
          open(p, 'w', encoding='utf-8').write(m)
          PY
          grep -q windowSplashScreenBackground android/app/src/main/res/values/styles.xml
      # Native plugins: self-update (+ install permission, FileProvider path), the books already on the phone
      # (+ storage and notification permissions, background scan worker), reading aloud (the WebView has no
      # speechSynthesis), and versionCode = run number (tag v1.0.<n> ends with it).
      - run: |
          pkg=android/app/src/main/java/com/yanivm/reader
          cp resources/android-updater/AppUpdaterPlugin.java $pkg/
          cp resources/android-device-books/DeviceBooksPlugin.java $pkg/
          cp resources/android-device-books/BackgroundScanWorker.java $pkg/
          cp resources/android-device-books/ImportKeepAliveService.java $pkg/
          cp resources/android-open-with/OpenWithPlugin.java $pkg/
          cp resources/android-tts/NativeTtsPlugin.java $pkg/
          cp resources/android-tts/ReadAloudService.java $pkg/
          sed -i 's/^public class MainActivity extends BridgeActivity {}$/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(AppUpdaterPlugin.class);\n        registerPlugin(DeviceBooksPlugin.class);\n        registerPlugin(OpenWithPlugin.class);\n        registerPlugin(NativeTtsPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}/' $pkg/MainActivity.java
          grep -q 'registerPlugin(DeviceBooksPlugin.class)' $pkg/MainActivity.java
          grep -q 'registerPlugin(OpenWithPlugin.class)' $pkg/MainActivity.java
          grep -q 'registerPlugin(NativeTtsPlugin.class)' $pkg/MainActivity.java
          # "Open with" / share sheet entries for book files, inside MainActivity's <activity>
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          f = open('resources/android-open-with/intent-filters.xml', encoding='utf-8').read()
          assert '</activity>' in m
          open(p, 'w', encoding='utf-8').write(m.replace('</activity>', f + '        </activity>', 1))
          PY
          grep -q 'android.intent.action.VIEW' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</paths>#    <external-files-path name="app_update" path="app-update/" />\n</paths>#' android/app/src/main/res/xml/file_paths.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q requestLegacyExternalStorage android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml
          # keep the import queue and the reading aloud alive while the app is not on the screen
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          assert '</application>' in m
          svc = ('        <service android:name=".ImportKeepAliveService" android:exported="false" android:foregroundServiceType="dataSync" />\n'
                 '        <service android:name=".ReadAloudService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    ')
          open(p, 'w', encoding='utf-8').write(m.replace('</application>', svc + '</application>', 1))
          PY
          grep -q ImportKeepAliveService android/app/src/main/AndroidManifest.xml
          grep -q ReadAloudService android/app/src/main/AndroidManifest.xml
          grep -q TTS_SERVICE android/app/src/main/AndroidManifest.xml
          grep -q FOREGROUND_SERVICE_DATA_SYNC android/app/src/main/AndroidManifest.xml
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
      # Release build (smaller, faster, WebView not debuggable), signed with the same fixed key (secrets)
      # so every build, including the earlier debug ones, can update the previous one.
      - run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
          cat >> android/app/build.gradle <<'EOF'
          android.signingConfigs {
            release {
              storeFile file('release.p12')
              storeType 'pkcs12'
              storePassword System.getenv('KEYSTORE_PASSWORD')
              keyAlias 'reader'
              keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
          }
          android.buildTypes.release.signingConfig android.signingConfigs.release
          // the scan that runs without the app on the screen (BackgroundScanWorker)
          dependencies {
            implementation 'androidx.work:work-runtime:2.9.1'
          }
          // lint on the generated Capacitor project only slows the build down
          android.lint.checkReleaseBuilds false
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: npx cap sync android
      # Cache Gradle downloads (Gradle itself, Android libraries) between builds. Key follows the lockfile because the
      # Capacitor version decides the Gradle and library versions; restore-keys reuse the latest cache when it changes.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'resources/**', '.github/workflows/android.yml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: printf '\norg.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n' >> android/gradle.properties
      - run: ./gradlew assembleRelease --build-cache
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: reader-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish release (used by the in-app updater)
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          gh release create "v1.0.${{ github.run_number }}" "$apk" --title "v1.0.${{ github.run_number }}" \
            --notes "$(printf 'versionCode: %s\nsha256: %s' '${{ github.run_number }}' "$sha")"
        env:
          GH_TOKEN: ${{ github.token }}
