name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      # Capacitor is installed only here, so package.json and the lockfile stay untouched.
      - run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap init "קורא ספרים" com.yanivm.reader --web-dir dist
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: reader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
