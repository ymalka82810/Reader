name: Build Android APK
on:
  workflow_dispatch:
permissions:\n  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      # Capacitor is installed only here, so package.json and the lockfile stay untouched.
      - run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap init "קורא ספרים" com.yanivm.reader --web-dir dist
      - run: npx cap add android
      # Launcher icons: Capacitor generates android/ fresh each run, so copy ours in.
      - run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          cp -r resources/android/. android/app/src/main/res/
      # Self-update: native plugin + permission + FileProvider path + versionCode = run number (tag v1.0.<n> ends with it).
      - run: |
          pkg=android/app/src/main/java/com/yanivm/reader
          cp resources/android-updater/AppUpdaterPlugin.java $pkg/
          sed -i 's/^public class MainActivity extends BridgeActivity {}$/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(AppUpdaterPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}/' $pkg/MainActivity.java
          grep -q registerPlugin $pkg/MainActivity.java
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</paths>#    <external-files-path name="app_update" path="app-update/" />\n</paths>#' android/app/src/main/res/xml/file_paths.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
      # Sign with the fixed key (secrets) so every build can update the previous one.
      - run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
          cat >> android/app/build.gradle <<'EOF'
          android.signingConfigs.debug {
              storeFile file('release.p12')
              storeType 'pkcs12'
              storePassword System.getenv('KEYSTORE_PASSWORD')
              keyAlias 'reader'
              keyPassword System.getenv('KEYSTORE_PASSWORD')
          }
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: reader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (used by the in-app updater)
        run: gh release create "v1.0.${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "v1.0.${{ github.run_number }}" --notes "Build ${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
