name: Dictionary packs
# Builds the offline dictionary packs (scripts/build-dictionary-packs.mjs, read by src/lib/offlineDict.ts) from kaikki.org and
# publishes them as the only commit of the dictionary-packs branch, which the app downloads from. Nothing in main changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 */3 *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node --max-old-space-size=8192 scripts/build-dictionary-packs.mjs packs
      - run: |
          cd packs
          git init -q -b dictionary-packs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Dictionary packs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dictionary-packs
