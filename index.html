    <!-- Chapter documents are blob: pages and inherit this policy. No 'unsafe-inline' and no blob: in
         script-src keeps scripts inside an EPUB from running (the book iframe is same-origin, so a
         running script could read the whole library). frame-src 'self' is for eye.html, the eye-scrolling
         page, which has its own policy. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; frame-src blob: 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data: https://api.github.com https://*.githubusercontent.com https://*.wiktionary.org https://api.mymemory.translated.net https://translate.googleapis.com https://www.googleapis.com https://openlibrary.org https://query.wikidata.org https://www.wikidata.org https://lingva.ml https://lingva.thedaviddelta.com; object-src 'none'; base-uri 'self'"
    />
    <title>קורא ספרים</title>

    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" />
    <!-- Splash screen: plain HTML/CSS so it shows before any script loads (the CSP allows inline styles,
         not inline scripts). main.tsx fades it out once the app has rendered (src/lib/splash.ts). -->
    <style>
      /* the splash color from the very first paint, so the screen isn't black or white before the splash draws */
      html:not(.splash-done) { background: #15294d; }
      #splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(circle at 50% 42%, #24467f 0%, #15294d 55%, #0e1b33 100%); color: #f3ead8; font-family: Heebo, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; transition: opacity .35s ease, visibility .35s; }
      #splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .sp-icon { position: relative; width: min(44vw, 200px); aspect-ratio: 1; border-radius: 22%; overflow: hidden; box-shadow: 0 18px 44px rgba(5, 12, 26, .55), 0 0 0 1px rgba(255, 255, 255, .06); animation: sp-in .5s cubic-bezier(.2, .8, .3, 1.2) both; }
      #splash .sp-icon > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #splash .sp-book { position: absolute; inset: 0; perspective: 900px; }
      /* a flipping leaf: the left page (x 92-216, y 110-330 of the 432 icon) turning over the spine to the right, as a Hebrew book is read */
      #splash .sp-leaf { position: absolute; left: 21.296%; top: 22.222%; width: 28.704%; height: 50.926%; transform-origin: 100% 50%; transform-style: preserve-3d; animation: sp-flip 4.5s cubic-bezier(.45, .05, .35, 1) infinite; }
      #splash .sp-leaf:nth-child(2), #splash .sp-leaf:nth-child(2) .sp-face, #splash .sp-leaf:nth-child(2) .sp-face::after { animation-delay: 1.5s; }
      #splash .sp-leaf:nth-child(3), #splash .sp-leaf:nth-child(3) .sp-face, #splash .sp-leaf:nth-child(3) .sp-face::after { animation-delay: 3s; }
      /* opacity on the leaf would flatten its 3D, so the landed leaf fades out on its faces */
      #splash .sp-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; animation: sp-fade 4.5s linear infinite; }
      #splash .sp-face svg { width: 100%; height: 100%; display: block; overflow: visible; }
      #splash .sp-back { transform: rotateY(180deg); }
      /* the leaf darkens while it is lifted; on the faces, since a filter on the leaf would flatten its 3D and hide the back */
      #splash .sp-face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14, 27, 51, .28), rgba(14, 27, 51, 0) 70%); opacity: 0; animation: sp-shade 4.5s cubic-bezier(.45, .05, .35, 1) infinite; clip-path: inset(2% 0 4% 0 round 6%); }
      #splash .sp-back::after { background: linear-gradient(270deg, rgba(14, 27, 51, .28), rgba(14, 27, 51, 0) 70%); }
      #splash .sp-ribbon { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #splash .sp-name { font-size: 22px; font-weight: 700; letter-spacing: .02em; opacity: .92; animation: sp-in .6s .15s ease both; }
      @keyframes sp-flip {
        0%, 8% { transform: rotateY(0deg); }
        52%, 100% { transform: rotateY(180deg); }
      }
      @keyframes sp-fade { 0%, 54% { opacity: 1; } 66%, 100% { opacity: 0; } }
      @keyframes sp-shade { 0%, 8% { opacity: 0; } 30% { opacity: 1; } 52%, 100% { opacity: 0; } }
      @keyframes sp-in { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash .sp-leaf { display: none; } #splash .sp-icon, #splash .sp-name { animation: none; } }
    </style>
